name: compile
on:
  workflow_dispatch:
    inputs:
      job:
        description: opaque id
        required: true
permissions:
  contents: read
concurrency:
  group: compile
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check id
        env:
          JOB: ${{ inputs.job }}
        run: |
          [[ "$JOB" =~ ^[0-9a-f]{32}$ ]] || { echo bad job id; exit 1; }
          echo "$JOB" > /tmp/jobid
      - name: Fetch (one use)
        id: fetch
        env:
          BROKER_URL: ${{ secrets.BROKER_URL }}
          BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
        run: |
          set +x
          mkdir -p work
          curl -sS -f -X POST "$BROKER_URL?action=builder-fetch" -H "x-builder-secret: $BUILDER_SECRET" -H "content-type: application/json" \
            -d "{\"action\":\"builder-fetch\",\"job\":\"$(cat /tmp/jobid)\"}" -o /tmp/job.json
          K=$(jq -r .key /tmp/job.json); echo "::add-mask::$K"
          umask 077; printf '%s' "$K" > /tmp/.k
          jq -r .source /tmp/job.json | base64 -d > /tmp/src.bin
          node c.mjs dec "$(cat /tmp/jobid)" /tmp/src.bin work/Tweak.xm
          cp builder/Makefile builder/control builder/Tweak.plist work/
          chmod -R a+rwX work
          rm -f /tmp/job.json /tmp/src.bin
      - name: Build toolchain image
        run: docker build -q -t theos builder/ > /dev/null
      - name: Compile (no network, no secrets, no capabilities)
        id: compile
        continue-on-error: true
        run: |
          set +e
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --read-only \
            --tmpfs /tmp:rw,size=256m --memory 2g --cpus 2 --pids-limit 256 --user 1001:1001 \
            -v "$PWD/work:/work" -w /work -e HOME=/tmp theos \
            sh -c 'timeout 300 make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME= > /work/build.log 2>&1'
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Encrypt and report
        # Report toolchain failures too, but never report an unclaimed job.
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          BROKER_URL: ${{ secrets.BROKER_URL }}
          BUILDER_SECRET: ${{ secrets.BUILDER_SECRET }}
        run: |
          set +x
          J=$(cat /tmp/jobid)
          D=work/.theos/obj/Tweak.dylib; [ -f "$D" ] || D=work/.theos/obj/arm64/Tweak.dylib
          if [ -f "$D" ] && [ "${{ steps.compile.outputs.code }}" = "0" ]; then
            node c.mjs enc "$J" "$D" /tmp/out.enc out
            curl -sS -f -X POST "$BROKER_URL?action=builder-done&job=$J&ok=1" -H "x-builder-secret: $BUILDER_SECRET" \
              -H "content-type: application/octet-stream" --data-binary @/tmp/out.enc
          else
            tail -c 2000 work/build.log 2>/dev/null | grep -E "error|Error" | head -c 1500 > /tmp/log.txt || true
            [ -s /tmp/log.txt ] || echo "compile failed" > /tmp/log.txt
            node c.mjs enc "$J" /tmp/log.txt /tmp/log.enc err
            curl -sS -f -X POST "$BROKER_URL?action=builder-done&job=$J&ok=0" -H "x-builder-secret: $BUILDER_SECRET" \
              -H "content-type: application/octet-stream" --data-binary @/tmp/log.enc
            shred -u /tmp/.k 2>/dev/null || true
            exit 1
          fi
      - name: Cleanup
        if: always()
        run: |
          shred -u /tmp/.k /tmp/out.enc /tmp/log.enc /tmp/log.txt /tmp/src.bin 2>/dev/null || true
          rm -rf work
